services:
  - type: web
    name: selfless-worker
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM
        value: noreply@selfless.io
      - key: API_BASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
